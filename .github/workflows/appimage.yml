name: Build AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtdeclarative'

      - name: Build binary
        run: |
          mkdir -p build
          cd build
          qmake6 ../emu-bridge.pro
          make -j$(nproc)

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/emu-bridge AppDir/usr/bin/emu-bridge
          cp pkgbuild/emu-bridge.desktop AppDir/usr/share/applications/emu-bridge.desktop
          cp pkgbuild/emu-bridge.svg AppDir/usr/share/icons/hicolor/scalable/apps/emu-bridge.svg
          curl -fsSL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE=$(which qmake6)
          export QML_SOURCES_PATHS="$PWD/src"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv emu-bridge*.AppImage emu-bridge-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu-bridge-x86_64.AppImage
          path: emu-bridge-x86_64.AppImage

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: emu-bridge-x86_64.AppImage
